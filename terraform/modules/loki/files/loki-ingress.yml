apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loki-ingress
  namespace: ${loki_namespace}
spec:
  ingressClassName: traefik
  rules:
  - host: ${loki_domain}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: loki
            port:
              number: 3100