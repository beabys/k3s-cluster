redis-ha:
  enabled: true

controller:
  replicas: 1

server:
  replicas: 2

repoServer:
  replicas: 2

applicationSet:
  enabled: true
  replicas: 2

global:
  domain: argocd.home.lab

configs:
  params:
    server.insecure: true

server:
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: traefik
      traefik.ingress.kubernetes.io/router.entrypoints: web
      traefik.ingress.kubernetes.io/router.tls: "false"
    hosts:
      -  argocd.home.lab