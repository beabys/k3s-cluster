apiVersion: v1
kind: Namespace
metadata:
  name: databases
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: databases
spec:
  ports:
    - protocol: TCP
      port: 3306          # Change to your DB port (e.g., 3306 for MySQL)
      targetPort: 3306
---
apiVersion: v1
kind: Endpoints
metadata:
  name: mysql
  namespace: databases
subsets:
  - addresses:
      - ip: 10.27.10.37  # Your homelab database server IP
    ports:
      - port: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: databases
spec:
  ports:
    - protocol: TCP
      port: 5432          # Change to your DB port (e.g., 3306 for MySQL)
      targetPort: 5432
---
apiVersion: v1
kind: Endpoints
metadata:
  name: postgresql
  namespace: databases
subsets:
  - addresses:
      - ip: 10.27.10.37  # Your homelab database server IP
    ports:
      - port: 5432