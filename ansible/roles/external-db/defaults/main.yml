---
# External databases to expose inside the cluster via Service + EndpointSlice.
# Local override: define external_databases in ansible/inventory/homelab/vars/local.yml (gitignored)
# Each entry:
#   namespace:             Kubernetes namespace for Service/EndpointSlice
#   database_name:         name of the Service/EndpointSlice (must be valid DNS-1123)
#   database_internal_port: cluster port (Service .spec.ports[].port)
#   database_host_port:     port on the external database host
#   database_host:          IP or hostname of the external database
external_databases: []
