---
- name: Check prerequisites (helm)
  ansible.builtin.command: which helm
  register: helm_check
  changed_when: false
  failed_when: false

- name: Fail if helm missing
  ansible.builtin.fail:
    msg: "helm binary not found on control node. Install with: brew install helm"
  when: helm_check.rc != 0

- name: Check prerequisites (kubectl)
  ansible.builtin.command: which kubectl
  register: kubectl_check
  changed_when: false
  failed_when: false

- name: Fail if kubectl missing
  ansible.builtin.fail:
    msg: "kubectl binary not found on control node."
  when: kubectl_check.rc != 0

- name: Add Prometheus Helm repository
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: "{{ prometheus_repo_url }}"
  ignore_errors: true

- name: Install/Upgrade kube-prometheus-stack
  kubernetes.core.helm:
    name: "{{ prometheus_release_name }}"
    chart_ref: "{{ prometheus_chart }}"
    release_namespace: "{{ prometheus_namespace }}"
    create_namespace: true
    values_files:
      - "{{ role_path }}/files/values.yaml"

- name: Apply Alertmanager Ingress
  kubernetes.core.k8s:
    state: present
    src: alertmanager-ingress.yml

- name: Apply Prometheus Ingress
  kubernetes.core.k8s:
    state: present
    src: prometheus-ingress.yml
