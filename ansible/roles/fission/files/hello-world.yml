apiVersion: fission.io/v1
kind: Package
metadata:
  name: hello-world-pkg
  namespace: fission
spec:
  environment:
    name: python-warm
    namespace: fission
  deployment:
    type: literal
    literal: ZGVmIG1haW4oKToKICAgIHJldHVybiAiSGVsbG8gZnJvbSB5b3VyIHplcm8tY29sZHN0YXJ0IEhvbWVsYWIgRmFhUyEi
---
apiVersion: fission.io/v1
kind: Function
metadata:
  name: hello-world
  namespace: fission
spec:
  environment:
    name: python-warm
    namespace: fission
  InvokeStrategy:
    StrategyType: execution
    ExecutionStrategy:
      ExecutorType: poolmgr
      MinScale: 1
      MaxScale: 1
  package:
    functionName: main
    packageref:
      name: hello-world-pkg
      namespace: fission
---
apiVersion: fission.io/v1
kind: HTTPTrigger
metadata:
  name: hello-world-route
  namespace: fission
spec:
  functionref:
    type: name
    name: hello-world
  host: ""
  relativeurl: /hello
  method: GET
