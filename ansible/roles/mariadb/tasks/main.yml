---
- name: Ensure MariaDB data directory exists
  ansible.builtin.file:
    path: "{{ mariadb_data_dir }}"
    state: directory
    mode: "0755"
  when: mariadb_docker_install | bool

- name: Deploy MariaDB container
  community.docker.docker_container:
    name: "{{ mariadb_container_name }}"
    image: "{{ mariadb_image }}"
    state: started
    restart_policy: always
    ports:
      - "{{ mariadb_port }}:{{ mariadb_port }}"
    volumes:
      - "{{ mariadb_data_dir }}:/var/lib/mysql"
    env:
      MYSQL_DATABASE: "{{ mariadb_database }}"
      MYSQL_USER: "{{ mariadb_user }}"
      MYSQL_PASSWORD: "{{ mariadb_password }}"
      MYSQL_ROOT_PASSWORD: "{{ mariadb_root_password }}"
    command: "--innodb-buffer-pool-size={{ mariadb_buffer_pool_size }}"
    memory: "{{ mariadb_memory_limit }}"
    memory_reservation: "{{ mariadb_memory_reservation }}"
    pull: true
  when: mariadb_docker_install | bool
