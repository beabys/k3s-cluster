---
- name: Fetch kubeconfig from K3s master and configure for HAProxy
  hosts: masters[0]
  gather_facts: false
  vars_files:
    - ../inventory/homelab/vars/local.yml
  tasks:
    - name: Fetch k3s.yaml from master
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: /tmp/k3s.yaml
        flat: true

    - name: Patch server address to HAProxy load balancer
      ansible.builtin.replace:
        path: /tmp/k3s.yaml
        regexp: 'server: https://(127\.0\.0\.1|localhost):6443'
        replace: 'server: https://{{ hostvars["docker-host"]["docker_host_ip"] }}:6443'
      delegate_to: localhost

    - name: Ensure ~/.kube directory exists
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.kube"
        state: directory
        mode: "0755"
      delegate_to: localhost

    - name: Check if kubeconfig exists
      ansible.builtin.stat:
        path: "{{ lookup('env', 'HOME') }}/.kube/config"
      delegate_to: localhost
      register: existing_kubeconfig

    - name: Backup existing kubeconfig
      ansible.builtin.copy:
        src: "{{ lookup('env', 'HOME') }}/.kube/config"
        dest: "{{ lookup('env', 'HOME') }}/.kube/config.backup"
        remote_src: false
      delegate_to: localhost
      when: existing_kubeconfig.stat.exists

    - name: Copy patched kubeconfig to ~/.kube/config
      ansible.builtin.copy:
        src: /tmp/k3s.yaml
        dest: "{{ lookup('env', 'HOME') }}/.kube/config"
        mode: "0600"
        remote_src: true
      delegate_to: localhost

    - name: Verify kubeconfig works
      ansible.builtin.command: kubectl get nodes
      delegate_to: localhost
      changed_when: false
      ignore_errors: true
