---
- name: Deploy External Secrets Operator and sync AWS Secrets Manager secrets
  hosts: localhost
  connection: local
  gather_facts: false
  pre_tasks:
    - name: Check for local override config file
      ansible.builtin.stat:
        path: "../inventory/homelab/vars/local.yml"
      register: eso_config

    - name: Load local override config
      ansible.builtin.include_vars:
        file: "../inventory/homelab/vars/local.yml"
      when: eso_config.stat.exists
  roles:
    - external-secrets
